[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "heraclitus-attack"
version = "2.0.0"
description = "Laboratorio red-team agentico, seguro e loopback-only para HeraclitusDB"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "JoseRFJuniorLLMs" },
]
keywords = ["heraclitusdb", "red-team", "security-testing", "llm-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
heraclitus-attack = "heraclitus_attack.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["heraclitus_attack"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

